name: Deploy to GitHub Pages

# Publishes the static Expo web export to https://parthplato.github.io/Medisense/.
#
# Everything the build needs is committed — the catalogue is a 1 MB JSON asset under assets/ —
# so this touches no external data source and is reproducible from the repo alone.
#
# WHY THIS PUSHES A BRANCH rather than using actions/deploy-pages. The Pages "GitHub Actions"
# source has to be turned on by a repo admin first, and actions/configure-pages could not turn it
# on itself: the default GITHUB_TOKEN is refused with "Resource not accessible by integration" on
# the create-Pages-site API. Pushing a gh-pages branch enabled Pages automatically, so that is the
# configuration the repo is actually in (build_type: legacy, source: gh-pages). This workflow
# matches it instead of fighting it.

on:
  push:
    branches: [master]
  workflow_dispatch:

# Only contents:write is needed — enough to push the built site to the gh-pages branch.
permissions:
  contents: write

# Never let two deployments race. Queue rather than cancel, so a push during a deploy still ends
# up published instead of being silently dropped.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # `npm ci` first, because it is the reproducible one. The fallback exists because of a real
        # npm limitation rather than a broken lockfile: optional dependencies gated on os/cpu
        # resolve per platform, so a lockfile written on macOS is missing the transitive deps of
        # @unrs/resolver-binding-wasm32-wasi that npm demands on Linux (@emnapi/core, @emnapi/
        # runtime), and no amount of regenerating it from a Mac can add them.
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Verify the dataset before shipping it
        # The same gates that run locally (build/8-verify.ts): equivalence groups never span a
        # route or dosage form, no withdrawn ingredient ships, every price is real or absent.
        # A failure here stops the deploy rather than publishing a wrong catalogue.
        run: npm run data:verify

      - name: Export the web build
        # baseUrl "/Medisense" in app.json is what makes asset URLs resolve under the project-pages
        # subpath instead of the domain root.
        run: npx expo export --platform web --output-dir dist

      - name: Make the export survivable on GitHub Pages
        run: |
          # Pages runs Jekyll, and Jekyll silently drops any path segment starting with an
          # underscore. Expo puts ALL of its JS and CSS under _expo/, so without this the site
          # deploys and then 404s on its own bundle.
          touch dist/.nojekyll

          # Pages has no rewrite rules, so a deep link (/Medisense/product/13452) is a hard 404.
          # Pages serves 404.html for unmatched paths and leaves the URL intact, which lets
          # expo-router read the route off location.pathname and render it.
          cp dist/index.html dist/404.html

      - name: Fail if the bundle did not make it into the export
        # A green deploy that serves a blank page is the failure this catches: if index.html ever
        # stops pointing at a file that exists, stop here rather than publishing it.
        run: |
          bundle=$(grep -o '/Medisense/_expo/static/js/web/[A-Za-z0-9._-]*\.js' dist/index.html | head -1)
          test -n "$bundle" || { echo "index.html references no bundle"; exit 1; }
          test -f "dist${bundle#/Medisense}" || { echo "missing bundle: $bundle"; exit 1; }
          echo "bundle ok: $bundle"

      - name: Publish to gh-pages
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish web export from ${GITHUB_SHA::7}"
          # Force-push: the branch is a build artifact, not history worth keeping.
          git push -f -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
